<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ابدأ تشخيص أعمالك مع سولفيو وحدد التحدي الأكثر تأثيرا على الربحية والتنفيذ." />
  <title>ابدأ التشخيص | سولفيو للاستشارات</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon-180.png">
  <meta name="theme-color" content="#0F2A43">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="start-form.css" />
</head>
<body>
  <a class="skip" href="#diagnostic" data-i18n="skip">انتقل إلى التشخيص</a>

  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="https://solvyoo.com/" aria-label="Solvyoo Advisory">
        <img class="logo logo-ar" src="../assets/logos/solvyoo-horizontal-ar.svg" alt="سولفيو للاستشارات">
        <img class="logo logo-en" src="../assets/logos/solvyoo-horizontal.svg" alt="Solvyoo Advisory">
      </a>
      <a class="start-back" href="https://solvyoo.com/" data-i18n="backHome">العودة للرئيسية</a>
      <button class="lang-toggle" type="button" aria-label="Switch language"><span class="active">AR</span><i></i><span>EN</span></button>
    </div>
  </header>

  <div class="wiz-progress"><div class="wiz-progress-fill" id="progressFill"></div></div>

  <main id="diagnostic" class="diagnostic-dark">
    <div class="wiz-inner">

      <!-- intro -->
      <div class="wiz-step active" id="step-intro">
        <span class="wiz-eyebrow" id="introEyebrow">التشخيص</span>
        <h1 class="wiz-h1" id="introTitle"></h1>
        <p class="wiz-body" id="introBody"></p>
        <div class="wiz-meta" id="introMeta"></div>
        <div style="margin-top:36px">
          <button class="wiz-primary" id="introCta"></button>
        </div>
      </div>

      <!-- question -->
      <div class="wiz-step" id="step-question">
        <div class="wiz-kicker"><b id="qStepLabel"></b> <span id="qOfLabel"></span></div>
        <h2 class="wiz-h2" id="qTitle"></h2>
        <div class="wiz-options" id="qOptions"></div>
        <div class="wiz-actions">
          <button class="wiz-ghost" id="qBack"></button>
          <span></span>
        </div>
      </div>

      <!-- textarea question -->
      <div class="wiz-step" id="step-textarea">
        <div class="wiz-kicker"><b id="taStepLabel"></b> <span id="taOfLabel"></span></div>
        <h2 class="wiz-h2" id="taTitle"></h2>
        <textarea class="wiz-textarea" id="taField" rows="4"></textarea>
        <div class="field-error" id="taError"></div>
        <div class="wiz-actions">
          <button type="button" class="wiz-ghost" id="taBack"></button>
          <button type="button" class="wiz-primary" id="taNext"></button>
        </div>
      </div>

      <!-- lead -->
      <div class="wiz-step" id="step-lead">
        <span class="wiz-done" id="leadDone"></span>
        <h2 class="wiz-h2" id="leadTitle"></h2>
        <p class="wiz-body" id="leadBody"></p>
        <form class="wiz-form" id="leadForm" novalidate>
          <div class="wiz-field">
            <label><span class="req">* </span><span id="lblName"></span></label>
            <input type="text" id="lead_name" autocomplete="name">
          </div>
          <div class="wiz-field">
            <label><span id="lblCompany"></span></label>
            <input type="text" id="lead_company" autocomplete="organization">
          </div>
          <div class="wiz-field">
            <label><span class="req">* </span><span id="lblEmail"></span></label>
            <input type="email" id="lead_email" dir="ltr" autocomplete="email">
          </div>
          <div class="wiz-field">
            <label><span class="req">* </span><span id="lblPhone"></span></label>
            <input type="tel" id="lead_phone" dir="ltr" autocomplete="tel">
          </div>
          <div class="field-error" id="leadError"></div>
          <div class="wiz-actions">
            <button type="button" class="wiz-ghost" id="leadBack"></button>
            <button type="submit" class="wiz-primary" id="leadSubmit">
              <span class="spinner" id="spinner"></span>
              <span id="leadSubmitText"></span>
            </button>
          </div>
        </form>
      </div>

      <!-- success -->
      <div class="wiz-step" id="step-success">
        <div class="success-wrap">
          <div class="success-icon">✓</div>
          <h3 id="successTitle"></h3>
          <p id="successMsg"></p>
          <p id="successNext"></p>
          <a class="success-calendly" id="bookCta" href="https://lunacal.ai/solvyoo/business-diagnostic" target="_blank" rel="noopener"></a>
        </div>
      </div>

    </div>
  </main>

  <section class="contact-rail" aria-label="روابط التواصل" data-i18n-aria="contactLinks">
    <div class="container contact-row">
      <a href="mailto:info@solvyoo.com" aria-label="البريد الإلكتروني" data-i18n-aria="emailLabel" title="Email">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
      </a>
      <a href="https://wa.me/966507398836" aria-label="واتساب" data-i18n-aria="whatsappLabel" title="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.7 7.4L3.5 20.5l1.4-4.1A8.5 8.5 0 1 1 20.5 11.6Z"/><path d="M8.1 7.9c.2 3.6 3 6.4 6.6 6.8l1.4-1.5 2.1 1c-.4 2.3-1.9 3.3-4.1 3-4.9-.8-8.1-4-8.8-8.9-.3-2.1.8-3.7 3-4.1l1 2.2Z"/></svg>
      </a>
      <a href="https://www.linkedin.com/in/solvyoo/" aria-label="لينكدإن" data-i18n-aria="linkedinLabel" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7.2v.1M12 17v-4c0-1.8 1-3 2.7-3 1.8 0 2.8 1.2 2.8 3.2V17M12 10v7"/></svg>
      </a>
      <a href="https://x.com/solvyoo" aria-label="إكس" data-i18n-aria="xLabel" title="X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4 19 20M19 4 5 20"/></svg>
      </a>
    </div>
  </section>

  <footer>
    <div class="container footer-grid">
      <a class="brand footer-brand" href="https://solvyoo.com/" aria-label="Solvyoo Advisory">
        <img class="logo logo-ar" src="../assets/logos/solvyoo-horizontal-ar-reversed.svg" alt="سولفيو للاستشارات">
        <img class="logo logo-en" src="../assets/logos/solvyoo-horizontal-reversed.svg" alt="Solvyoo Advisory">
      </a>
      <p data-i18n="footerText">استشارات تنفيذية تساعد الشركات على اكتشاف فرص الربحية وتحويلها إلى أولويات عملية.</p>
    </div>
    <div class="container footer-bottom"><span data-i18n="copyright">© 2026 سولفيو للاستشارات</span><a href="https://solvyoo.com/privacy.html" data-i18n="privacy">سياسة الخصوصية</a></div>
  </footer>

  <!-- Diagnostic form logic (webhook + FormData fields unchanged) -->
  <script>
(function(){
  var WEBHOOK = 'https://n8n.doitsmart.cloud/webhook/free-intake';
  var BOOKING = 'https://lunacal.ai/solvyoo/business-diagnostic';

  var T = {
    ar: {
      dir:'rtl',
      eyebrow:'التشخيص',
      introTitle:'لنبدأ بتشخيص موجز لأعمالك.',
      introBody:'سبع أسئلة منظمة، تستغرق نحو أربع دقائق. نستخدم إجاباتك لتأطير المحادثة الأولى حول أين تكمن المكاسب القادمة في أعمالك.',
      introMeta:['7 أسئلة','نحو 4 دقائق','بدون التزام'],
      introCta:'ابدأ التشخيص',
      step:'الخطوة', of:'من', back:'السابق', nextBtn:'التالي',
      questions:[
        {id:'sector', q:'ما القطاع الذي تعمل فيه منشأتك؟', options:['تجزئة وتجارة','صناعة وتصنيع','خدمات احترافية','ضيافة وأغذية','لوجستيات وتوزيع','قطاع آخر']},
        {id:'revenue', q:'ما النطاق التقريبي للإيرادات السنوية؟', options:['أقل من 5 مليون ريال','5 – 20 مليون ريال','20 – 50 مليون ريال','50 – 200 مليون ريال','أكثر من 200 مليون ريال']},
        {id:'constraint', q:'ما التحدي الأكثر تأثيراً على أداء عملك حالياً؟', options:['ضعف الأرباح رغم المبيعات','بطء أو تعثر العمليات اليومية','صعوبة اتخاذ القرارات الصحيحة','توقف النمو أو صعوبة التوسع','مشاكل في الفريق والتنظيم']},
        {id:'problem_detail', type:'textarea', q:'ما المشكلة التي تعاني منها؟', placeholder:'مثال: أرباحنا تراجعت آخر سنة ولا أعرف السبب بالضبط، والمصاريف ترتفع...'},
        {id:'urgency', q:'ما مدى أولوية معالجة ذلك؟', options:['فوري، خلال هذا الربع','خلال 3 إلى 6 أشهر','نخطط للأشهر القادمة','نستكشف الخيارات فقط']},
        {id:'role', q:'ما صفتك في المنشأة؟', options:['مالك / مؤسس','رئيس تنفيذي','عضو منتدب / مدير عام','قيادة الجيل الثاني','دور قيادي آخر']},
        {id:'team_size', q:'كم عدد موظفي منشأتك؟', options:['1 – 5','6 – 15','16 – 50','أكثر من 50']}
      ],
      done:'اكتمل التشخيص',
      leadTitle:'أين نرسل ملخص التشخيص؟',
      leadBody:'نراجع إجاباتك ونعود إليك بإطار أولي للمحادثة الأولى خلال 24 ساعة.',
      f_name:'الاسم الكامل', f_company:'اسم الشركة', f_email:'البريد الإلكتروني', f_phone:'رقم الجوال',
      finish:'أكمل واطلب التشخيص', submitting:'جاري الإرسال...',
      errRequired:'هذا الحقل مطلوب', errEmail:'البريد الإلكتروني غير صحيح',
      errDetailMin:'يرجى وصف التحدي بما لا يقل عن 20 حرفاً',
      successTitle:'تم استلام طلبك', successMsg:'سنراجع إجاباتك ونرسل لك الملاحظات الأولية خلال 24 ساعة.',
      successNext:'إذا كنت تفضل مناقشة الوضع مباشرة، يمكنك حجز جلسة تشخيص الآن.', bookCta:'احجز جلسة تشخيص'
    },
    en: {
      dir:'ltr',
      eyebrow:'The diagnostic',
      introTitle:'Let’s begin with a brief diagnostic.',
      introBody:'Seven structured questions, about four minutes. We use your answers to frame the first conversation around where the next gains in your business are.',
      introMeta:['7 questions','~4 minutes','No commitment'],
      introCta:'Start the diagnostic',
      step:'Step', of:'of', back:'Back', nextBtn:'Next',
      questions:[
        {id:'sector', q:'What sector does your business operate in?', options:['Retail & trade','Industry & manufacturing','Professional services','Hospitality & food','Logistics & distribution','Another sector']},
        {id:'revenue', q:'What is your approximate annual revenue?', options:['Under SAR 5M','SAR 5 – 20M','SAR 20 – 50M','SAR 50 – 200M','Over SAR 200M']},
        {id:'constraint', q:'What is the challenge affecting your business performance most right now?', options:['Weak profits despite sales','Slow or stalled daily operations','Difficulty making the right decisions','Stalled growth or hard expansion','Team and structure problems']},
        {id:'problem_detail', type:'textarea', q:'What problem are you facing?', placeholder:'e.g. Our profits dropped last year and I’m not sure exactly why, while costs keep rising...'},
        {id:'urgency', q:'How much of a priority is addressing it?', options:['Immediate, this quarter','Within 3 to 6 months','Planning for the months ahead','Just exploring options']},
        {id:'role', q:'What is your role in the business?', options:['Owner / Founder','CEO','Managing Director / GM','Second-generation leadership','Another leadership role']},
        {id:'team_size', q:'How many employees does your business have?', options:['1 – 5','6 – 15','16 – 50','More than 50']}
      ],
      done:'Diagnostic complete',
      leadTitle:'Where should we send your diagnostic summary?',
      leadBody:'We review your answers and return with an initial frame for the first conversation within 24 hours.',
      f_name:'Full name', f_company:'Company', f_email:'Email', f_phone:'Phone',
      finish:'Finish and request the diagnostic', submitting:'Submitting...',
      errRequired:'This field is required', errEmail:'Invalid email address',
      errDetailMin:'Please write at least 20 characters',
      successTitle:'Request received', successMsg:'We will review your answers and send your initial notes within 24 hours.',
      successNext:'If you’d prefer to discuss it directly, you can book a diagnostic session now.', bookCta:'Book a diagnostic session'
    }
  };

  var lang = (localStorage.getItem('solvyoo-language') || 'ar');
  var step = 0;            // 0 = intro, 1..7 = questions, 8 = lead, 9 = success
  var TOTAL = 7;
  var answers = {};
  var lead = { name:'', company:'', email:'', phone:'' };

  function $(id){ return document.getElementById(id); }
  function t(){ return T[lang]; }

  function setProgress(){
    var p = step <= 0 ? 0 : (step >= TOTAL + 2 ? 1 : Math.min(step, TOTAL+1) / (TOTAL+1));
    $('progressFill').style.width = (p*100) + '%';
  }

  function showStep(name){
    ['intro','question','textarea','lead','success'].forEach(function(s){
      $('step-'+s).classList.toggle('active', s === name);
    });
  }

  function renderIntro(){
    var x = t();
    $('introEyebrow').textContent = x.eyebrow;
    $('introTitle').textContent = x.introTitle;
    $('introBody').textContent = x.introBody;
    $('introCta').textContent = x.introCta;
    var m = $('introMeta'); m.innerHTML = '';
    x.introMeta.forEach(function(s){ var b=document.createElement('span'); b.className='wiz-badge'; b.textContent=s; m.appendChild(b); });
    showStep('intro');
  }

  function renderQuestion(){
    var x = t(); var q = x.questions[step-1];
    $('qStepLabel').textContent = x.step + ' ' + step;
    $('qOfLabel').textContent = x.of + ' ' + TOTAL;
    $('qTitle').textContent = q.q;
    $('qBack').textContent = x.back;
    var box = $('qOptions'); box.innerHTML = '';
    q.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt-row' + (answers[q.id] === opt ? ' selected' : '');
      btn.innerHTML = '<span class="opt-check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span class="opt-label"></span>';
      btn.querySelector('.opt-label').textContent = opt;
      btn.addEventListener('click', function(){
        answers[q.id] = opt;
        box.querySelectorAll('.opt-row').forEach(function(r){ r.classList.remove('selected'); });
        btn.classList.add('selected');
        setTimeout(next, 200);
      });
      box.appendChild(btn);
    });
    showStep('question');
  }

  function renderTextarea(){
    var x = t(); var q = x.questions[step-1];
    $('taStepLabel').textContent = x.step + ' ' + step;
    $('taOfLabel').textContent = x.of + ' ' + TOTAL;
    $('taTitle').textContent = q.q;
    $('taField').setAttribute('placeholder', q.placeholder || '');
    $('taField').value = answers[q.id] || '';
    $('taField').classList.remove('err');
    $('taError').textContent = '';
    $('taBack').textContent = x.back;
    $('taNext').textContent = x.nextBtn;
    showStep('textarea');
  }

  function renderLead(){
    var x = t();
    $('leadDone').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 16 9.5"/></svg> ' + x.done;
    $('leadTitle').textContent = x.leadTitle;
    $('leadBody').textContent = x.leadBody;
    $('lblName').textContent = x.f_name; $('lblCompany').textContent = x.f_company;
    $('lblEmail').textContent = x.f_email; $('lblPhone').textContent = x.f_phone;
    $('leadBack').textContent = x.back;
    $('leadSubmitText').textContent = x.finish;
    $('lead_name').value = lead.name; $('lead_company').value = lead.company;
    $('lead_email').value = lead.email; $('lead_phone').value = lead.phone;
    $('leadError').textContent = '';
    showStep('lead');
  }

  function renderSuccess(){
    var x = t();
    $('successTitle').textContent = x.successTitle;
    $('successMsg').textContent = x.successMsg;
    $('successNext').textContent = x.successNext;
    $('bookCta').textContent = x.bookCta;
    $('bookCta').setAttribute('href', BOOKING);
    showStep('success');
  }

  function render(){
    document.documentElement.lang = lang;
    document.documentElement.dir = t().dir;
    if (step === 0) renderIntro();
    else if (step >= 1 && step <= TOTAL) {
      if (t().questions[step-1].type === 'textarea') renderTextarea();
      else renderQuestion();
    }
    else if (step === TOTAL + 1) renderLead();
    else renderSuccess();
    setProgress();
    window.scrollTo(0, 0);
  }

  function next(){ if (step < TOTAL + 1) { step++; render(); } }
  function back(){ if (step > 0) { step--; render(); } }

  function captureLead(){
    lead.name = $('lead_name').value.trim();
    lead.company = $('lead_company').value.trim();
    lead.email = $('lead_email').value.trim();
    lead.phone = $('lead_phone').value.trim();
  }

  function validateLead(){
    captureLead();
    var x = t(); var ok = true; var msg = '';
    $('lead_name').classList.remove('err'); $('lead_email').classList.remove('err'); $('lead_phone').classList.remove('err');
    if (!lead.name) { $('lead_name').classList.add('err'); ok = false; msg = x.errRequired; }
    if (!lead.email) { $('lead_email').classList.add('err'); ok = false; msg = x.errRequired; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lead.email)) { $('lead_email').classList.add('err'); ok = false; msg = x.errEmail; }
    if (!lead.phone) { $('lead_phone').classList.add('err'); ok = false; msg = x.errRequired; }
    $('leadError').textContent = ok ? '' : msg;
    return ok;
  }

  function submit(e){
    e.preventDefault();
    if (!validateLead()) return;
    var btn = $('leadSubmit');
    btn.disabled = true;
    $('spinner').style.display = 'block';
    $('leadSubmitText').textContent = t().submitting;

    var fd = new FormData();
    fd.append('company_name', lead.company);
    fd.append('contact_name', lead.name);
    fd.append('email', lead.email);
    fd.append('phone', lead.phone);
    fd.append('sector', answers.sector || '');
    fd.append('revenue', answers.revenue || '');
    fd.append('problem_description', answers.problem_detail || '');
    fd.append('problem_detail', answers.problem_detail || '');
    fd.append('constraint', answers.constraint || '');
    fd.append('urgency', answers.urgency || '');
    fd.append('role', answers.role || '');
    fd.append('team_size', answers.team_size || '');
    fd.append('language', lang);
    fd.append('source', 'solvyoo.com/start');
    fd.append('answers_summary', JSON.stringify(answers));

    fetch(WEBHOOK, { method:'POST', body:fd }).finally(function(){
      step = TOTAL + 2;     // success
      render();
    });
  }

  function validateTextarea(){
    var x = t(); var q = x.questions[step-1];
    var val = $('taField').value.trim();
    var msg = !val ? x.errRequired : (val.length < 20 ? x.errDetailMin : '');
    $('taField').classList.toggle('err', !!msg);
    $('taError').textContent = msg;
    if (msg) return false;
    answers[q.id] = val;
    return true;
  }

  // events
  $('introCta').addEventListener('click', next);
  $('qBack').addEventListener('click', back);
  $('taBack').addEventListener('click', back);
  $('taNext').addEventListener('click', function(){ if (validateTextarea()) next(); });
  $('taField').addEventListener('input', function(){
    answers[t().questions[step-1].id] = $('taField').value;
    $('taField').classList.remove('err');
    $('taError').textContent = '';
  });
  $('leadBack').addEventListener('click', function(){ captureLead(); back(); });
  $('leadForm').addEventListener('submit', submit);

  // Bridge: the page chrome (v7 header) owns the single language toggle.
  window.solvyooSetFormLang = function(l){
    if (l === lang) return;
    if (step === TOTAL + 1) captureLead();
    lang = l;
    render();
  };

  render();
})();
  </script>

  <!-- Chrome i18n + single language toggle (drives both chrome and form) -->
  <script>
(function(){
  var langToggle = document.querySelector('.lang-toggle');
  var chromeCopy = {
    ar: { skip:'انتقل إلى التشخيص', backHome:'العودة للرئيسية', contactLinks:'روابط التواصل', emailLabel:'البريد الإلكتروني', whatsappLabel:'واتساب', linkedinLabel:'لينكدإن', xLabel:'إكس', footerText:'استشارات تنفيذية تساعد الشركات على اكتشاف فرص الربحية وتحويلها إلى أولويات عملية.', copyright:'© 2026 سولفيو للاستشارات', privacy:'سياسة الخصوصية', title:'ابدأ التشخيص | سولفيو للاستشارات' },
    en: { skip:'Skip to the diagnostic', backHome:'Back to Home', contactLinks:'Contact links', emailLabel:'Email', whatsappLabel:'WhatsApp', linkedinLabel:'LinkedIn', xLabel:'X', footerText:'Executive advisory that helps businesses uncover profit opportunities and turn them into practical priorities.', copyright:'© 2026 Solvyoo Advisory', privacy:'Privacy Policy', title:'Start Your Diagnostic | Solvyoo Advisory' }
  };
  function setChromeLang(lang){
    var c = chromeCopy[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.body.classList.toggle('lang-en', lang === 'en');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ var k = el.dataset.i18n; if (c[k]) el.textContent = c[k]; });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ var k = el.dataset.i18nAria; if (c[k]) el.setAttribute('aria-label', c[k]); });
    var spans = langToggle.querySelectorAll('span');
    spans[0].classList.toggle('active', lang === 'ar');
    spans[1].classList.toggle('active', lang === 'en');
    localStorage.setItem('solvyoo-language', lang);
    document.title = c.title;
    if (window.solvyooSetFormLang) window.solvyooSetFormLang(lang);
  }
  langToggle.addEventListener('click', function(){
    setChromeLang(document.documentElement.lang === 'ar' ? 'en' : 'ar');
  });
  setChromeLang(localStorage.getItem('solvyoo-language') || 'ar');
})();
  </script>
</body>
