<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvyoo Advisory — التشخيص</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A43; --navy-dark:#071E30; --emerald:#1F5E4A; --emerald-2:#2A7A61;
  --gold:#C6A76B; --paper:#F8FAFC; --muted:#9DB0C0; --border:rgba(255,255,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Kufi Arabic',sans-serif;background:var(--navy);color:var(--paper);line-height:1.8;min-height:100vh;display:flex;flex-direction:column}

/* nav */
nav{position:fixed;top:0;inset-inline:0;z-index:30;height:64px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;background:rgba(15,42,67,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-logo{display:inline-flex;align-items:center;gap:10px;direction:ltr;text-decoration:none}
.nav-logo .brand-text{display:flex;flex-direction:column;line-height:1.05;letter-spacing:.14em}
.nav-logo .brand-text span{font-family:Inter,system-ui,sans-serif;font-size:16px;font-weight:700;color:#F8FAFC}
.nav-logo .brand-text small{font-family:Inter,system-ui,sans-serif;font-size:9px;font-weight:700;letter-spacing:.3em;color:var(--gold)}
.lang-btn{background:none;border:1px solid rgba(255,255,255,.15);padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:#F8FAFC;cursor:pointer;font-family:Inter,sans-serif;transition:border-color .2s}
.lang-btn:hover{border-color:rgba(255,255,255,.4)}

/* progress */
.wiz-progress{position:fixed;top:64px;inset-inline:0;height:3px;background:rgba(255,255,255,.1);z-index:25}
.wiz-progress-fill{height:100%;width:0;background:var(--gold);transition:width .4s cubic-bezier(.22,1,.36,1)}

/* wizard */
.wiz-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:120px 24px 70px}
.wiz-inner{width:100%;max-width:720px}
.wiz-step{display:none}
.wiz-step.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wiz-eyebrow{font-family:Inter,sans-serif;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);display:inline-flex;align-items:center;gap:10px}
.wiz-eyebrow::before{content:"";width:26px;height:1px;background:currentColor;opacity:.6}
.wiz-h1{font-size:clamp(30px,4.6vw,46px);line-height:1.18;letter-spacing:-.02em;font-weight:700;margin:22px 0 0;color:#fff}
.wiz-h2{font-size:clamp(23px,3vw,32px);line-height:1.3;letter-spacing:-.02em;font-weight:700;margin:14px 0 0;color:#fff}
.wiz-body{margin:22px 0 0;font-size:17px;line-height:1.7;color:rgba(248,250,252,.68);max-width:54ch}
.wiz-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.wiz-badge{font-size:13px;color:rgba(248,250,252,.8);padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.15)}
.wiz-actions{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.wiz-primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:14px 28px;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--emerald);color:#fff;box-shadow:0 14px 34px rgba(31,94,74,.34);transition:background .2s}
.wiz-primary:hover{background:var(--emerald-2)}
.wiz-primary:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.wiz-ghost{background:none;border:none;color:rgba(255,255,255,.7);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;padding:12px 6px;transition:color .2s}
.wiz-ghost:hover{color:#fff}
.wiz-kicker{font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.wiz-kicker b{color:var(--gold);font-weight:700}
.wiz-options{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.opt-row{display:flex;align-items:center;gap:16px;width:100%;text-align:start;padding:17px 20px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:500;color:#fff;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:10px;transition:background .15s,border-color .15s}
.opt-row:hover{background:rgba(255,255,255,.06)}
.opt-row.selected{background:rgba(31,94,74,.18);border-color:var(--emerald-2)}
.opt-check{flex-shrink:0;width:20px;height:20px;border-radius:5px;border:1px solid rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center}
.opt-row.selected .opt-check{background:var(--emerald);border-color:var(--emerald)}
.opt-check svg{display:none}
.opt-row.selected .opt-check svg{display:block}
.wiz-done{display:inline-flex;align-items:center;gap:9px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--emerald-2)}
.wiz-form{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wiz-field{display:flex;flex-direction:column;gap:6px}
.wiz-field label{font-size:13px;color:rgba(248,250,252,.6)}
.wiz-field label .req{color:#e0a96d}
.wiz-field input{padding:13px 14px;font-size:15px;font-family:inherit;color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:8px;outline:none;transition:border-color .2s,box-shadow .2s}
.wiz-field input:focus{border-color:var(--emerald-2);box-shadow:0 0 0 3px rgba(42,122,97,.22)}
.wiz-field input::placeholder{color:rgba(248,250,252,.32)}
.wiz-field input.err{border-color:#e0a96d}
.field-error{grid-column:1/-1;color:#e0a96d;font-size:13px;min-height:18px}
.wiz-form .wiz-actions{grid-column:1/-1;margin-top:6px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* success */
.success-wrap{text-align:center;padding:10px 0}
.success-icon{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:rgba(31,94,74,.2);border:1px solid var(--emerald-2);display:flex;align-items:center;justify-content:center;color:var(--emerald-2);font-size:30px}
.success-wrap h3{font-size:26px;color:#fff;margin-bottom:12px}
.success-wrap p{color:rgba(248,250,252,.66);font-size:16px;line-height:1.7;max-width:46ch;margin:0 auto 8px}
.success-calendly{display:inline-block;margin-top:22px;padding:14px 28px;border-radius:8px;background:var(--gold);color:var(--navy-dark);font-weight:700;text-decoration:none;transition:background .2s}
.success-calendly:hover{background:#b2925a}

/* footer — icons only, blended background */
footer{background:transparent;padding:40px 42px;display:flex;justify-content:center;align-items:center}
.footer-socials{display:flex;gap:20px;align-items:center}
.footer-socials a{color:rgba(248,250,252,.55);display:inline-flex;transition:color .2s}
.footer-socials a:hover{color:var(--gold)}

@media(max-width:680px){
  nav{padding:0 20px}
  .wiz-wrap{padding:104px 18px 50px}
  .wiz-form{grid-template-columns:1fr}
}
</style>
</head>

        <div class="wiz-field">
          <label><span id="lblPhone"></span></label>
          <input type="tel" id="lead_phone" dir="ltr" autocomplete="tel">
        </div>
        <div class="field-error" id="leadError"></div>
        <div class="wiz-actions">
          <button type="button" class="wiz-ghost" id="leadBack"></button>
          <button type="submit" class="wiz-primary" id="leadSubmit">
            <span class="spinner" id="spinner"></span>
            <span id="leadSubmitText"></span>
          </button>
        </div>
      </form>
    </div>

    <!-- success -->

        <div class="success-icon">✓</div>
        <h3 id="successTitle"></h3>
        <p id="successMsg"></p>
        <p id="successNext"></p>
        <a class="success-calendly" id="bookCta" href="https://lunacal.ai/solvyoo/business-diagnostic" target="_blank" rel="noopener"></a>
      </div>
    </div>

  </div>
</main>

<script>
(function(){
  var WEBHOOK = 'https://n8n.doitsmart.cloud/webhook/free-intake';
  var BOOKING = 'https://lunacal.ai/solvyoo/business-diagnostic';

  var T = {
    ar: {
      dir:'rtl', langBtn:'EN',
      eyebrow:'التشخيص',
      introTitle:'لنبدأ بتشخيص موجز لأعمالك.',

        {id:'urgency', q:'ما مدى إلحاح معالجة ذلك؟', options:['فوري — خلال هذا الربع','خلال 3 إلى 6 أشهر','نخطط للأشهر القادمة','نستكشف الخيارات فقط']},

  function setProgress(){

  function renderQuestion(){

    $('qStepLabel').textContent = x.step + ' ' + step;

    $('qBack').textContent = x.back;

        box.querySelectorAll('.opt-row').forEach(function(r){ r.classList.remove('selected'); });
        btn.classList.add('selected');
        setTimeout(next, 200);
      });
      box.appendChild(btn);
    });
    showStep('question');

  function renderLead(){
    var x = t();
    $('leadDone').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 16 9.5"/></svg> ' + x.done;

    $('leadBody').textContent = x.leadBody;
    $('lblName').textContent = x.f_name; $('lblCompany').textContent = x.f_company;
    $('lblEmail').textContent = x.f_email; $('lblPhone').textContent = x.f_phone;
    $('leadBack').textContent = x.back;
    $('leadSubmitText').textContent = x.finish;
    $('lead_name').value = lead.name; $('lead_company').value = lead.company;
    $('lead_email').value = lead.email; $('lead_phone').value = lead.phone;
    $('leadError').textContent = '';
    showStep('lead');
  }

  function renderSuccess(){
    var x = t();
    $('successTitle').textContent = x.successTitle;
    $('successMsg').textContent = x.successMsg;
    $('successNext').textContent = x.successNext;
    $('bookCta').textContent = x.bookCta;
    $('bookCta').setAttribute('href', BOOKING);
    showStep('success');
  }

  function render(){
    document.documentElement.lang = lang;
    document.documentElement.dir = t().dir;
    $('langBtn').textContent = t().langBtn;
    if (step === 0) renderIntro();
    else if (step >= 1 && step <= TOTAL) renderQuestion();
    else if (step === TOTAL + 1) renderLead();
    else renderSuccess();
    setProgress();
    window.scrollTo(0, 0);
  }

  function next(){ if (step < TOTAL + 1) { step++; render(); } }
  function back(){ if (step > 0) { step--; render(); } }

  function captureLead(){
    lead.name = $('lead_name').value.trim();
    lead.company = $('lead_company').value.trim();
    lead.email = $('lead_email').value.trim();
    lead.phone = $('lead_phone').value.trim();
  }

  function validateLead(){
    captureLead();
    var x = t(); var ok = true; var msg = '';
    $('lead_name').classList.remove('err'); $('lead_email').classList.remove('err');
    if (!lead.name) { $('lead_name').classList.add('err'); ok = false; msg = x.errRequired; }
    if (!lead.email) { $('lead_email').classList.add('err'); ok = false; msg = x.errRequired; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lead.email)) { $('lead_email').classList.add('err'); ok = false; msg = x.errEmail; }
    $('leadError').textContent = ok ? '' : msg;
    return ok;
  }

  function submit(e){
    e.preventDefault();
    if (!validateLead()) return;
    var btn = $('leadSubmit');
    btn.disabled = true;
    $('spinner').style.display = 'block';
    $('leadSubmitText').textContent = t().submitting;

    var fd = new FormData();
    fd.append('company_name', lead.company);
    fd.append('contact_name', lead.name);
    fd.append('email', lead.email);
    fd.append('phone', lead.phone);
    fd.append('sector', answers.sector || '');
    fd.append('revenue', answers.revenue || '');
    fd.append('problem_description', answers.constraint || '');
    fd.append('constraint', answers.constraint || '');
    fd.append('urgency', answers.urgency || '');
    fd.append('role', answers.role || '');
    fd.append('language', lang);
    fd.append('source', 'solvyoo.com/start');
    fd.append('answers_summary', JSON.stringify(answers));

    fetch(WEBHOOK, { method:'POST', body:fd }).finally(function(){
      step = TOTAL + 2;     // success
      render();
    });
  }

  // events
  $('introCta').addEventListener('click', next);
  $('qBack').addEventListener('click', back);
  $('leadBack').addEventListener('click', function(){ captureLead(); back(); });
  $('leadForm').addEventListener('submit', submit);
  $('langBtn').addEventListener('click', function(){
    if (step === TOTAL + 1) captureLead();
    lang = (lang === 'ar') ? 'en' : 'ar';
    render();
  });

  render();
})();
</script>
</body>
</html>
